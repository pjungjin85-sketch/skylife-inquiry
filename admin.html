<head>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs>
<symbol id="i-back" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5m0 0 6-6m-6 6 6 6"/></symbol>
<symbol id="i-refresh" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 12a8.5 8.5 0 1 1 2.6 6.1"/><path d="M3.5 19v-5h5"/></symbol>
<symbol id="i-pin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3.5h6l-.8 5.2 3.3 3.3H6.5l3.3-3.3z"/><path d="M12 12v8.5"/></symbol>

<symbol id="i-inbox" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 13.5h4l1.5 3h6l1.5-3h4"/><path d="M5.3 5.2 3.5 13.5v3.8a2 2 0 0 0 2 2h13a2 2 0 0 0 2-2v-3.8L18.7 5.2a2 2 0 0 0-1.8-1.2H7.1a2 2 0 0 0-1.8 1.2z"/></symbol>
<symbol id="i-user" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4.5 20.5a7.5 7.5 0 0 1 15 0"/></symbol>

</defs></svg>


<!-- 잠금 화면 -->
<div id="lock-overlay">
  <div id="lock-loading" class="lock-loading"><span class="spinner"></span></div>
  <div class="lock-box login-area" id="login-area">
    <div class="lock-logo">kt <span>skylife</span></div>
    <div class="lock-title">관리자 로그인</div>
    <div class="lock-label">관리자 아이디</div>
    <div class="lock-input-wrap">
      <input type="text" id="admin-username" placeholder="아이디" autocomplete="username" onkeydown="if(event.key==='Enter')document.getElementById('admin-password').focus()">
    </div>
    <div class="lock-label">비밀번호</div>
    <div class="lock-input-wrap">
      <input type="password" id="admin-password" placeholder="비밀번호 입력" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()">
      <button class="lock-toggle" id="pw-toggle" onclick="togglePw()" aria-label="비밀번호 표시"><svg><use href="#i-eye"></use></svg></button>
    </div>
    <div class="lock-error" id="pw-error"></div>
    <button class="lock-btn" id="login-btn" onclick="login()">로그인</button>
  </div>
</div>

<header>
  <div class="header-inner">
    <span class="logo-text">kt <span>skylife</span></span>
    <span class="header-badge">관리자</span>
    <span class="header-title">관리자 페이지</span>
    <button class="logout-btn" onclick="logout()">로그아웃</button>
  </div>
</header>

<div class="content">
  <div class="main-tab-bar">
    <button class="main-tab-btn active" data-tab="notices" onclick="switchMainTab('notices')">공지사항 관리</button>
    <button class="main-tab-btn" data-tab="accounts" onclick="switchMainTab('accounts')">회원 승인</button>
  </div>

  <div id="tab-notices" class="main-tab-content active">
    <div class="section-head has-illust">
      <div class="section-head-text">
        <span class="section-num">01</span>
        <h2>공지사항 관리</h2>
        <span class="section-note">작성 · 상단 고정 · 수정·삭제</span>
      </div>
      <img class="section-illust" src="img/illust/notices.svg" width="606" height="700" alt="" decoding="async">
    </div>
    <div class="form-card">
      <h2 id="form-title">공지 작성</h2>
      <div class="form-row">
        <div class="form-group">
          <label>제목</label>
          <input type="text" id="f-title" placeholder="공지 제목">
        </div>
        <div class="form-group">
          <label>분류</label>
          <select id="f-category">
            <option>긴급</option>
            <option>정책</option>
            <option>규제</option>
            <option>상품</option>
            <option selected>기타</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label>내용</label>
        <textarea id="f-content" placeholder="공지 내용을 입력해주세요."></textarea>
      </div>
      <div class="form-group form-group-checkbox">
        <label class="checkbox-label">
          <input type="checkbox" id="f-pinned">
          <span>상단 고정 (게시판 맨 위에 계속 고정 노출)</span>
        </label>
      </div>
      <div class="form-actions">
        <button class="btn-ghost" id="cancel-edit-btn" onclick="cancelEdit()" style="display:none">취소</button>
        <button class="btn-primary" id="submit-btn" onclick="submitNotice()">등록</button>
      </div>
      <div class="form-feedback" id="form-feedback"></div>
    </div>

    <div class="search-bar">
      <div class="search-wrap">
        <svg><use href="#i-search"></use></svg>
        <input type="text" id="notice-search" class="search-input" placeholder="제목 또는 내용 검색" aria-label="제목 또는 내용 검색" oninput="setNoticeSearch(this.value)">
      </div>
    </div>
    <div class="list-header">
      <span class="list-count" id="notice-count"></span>
      <button class="refresh-btn" onclick="loadNotices()"><svg><use href="#i-refresh"></use></svg>새로고침</button>
    </div>
    <div id="notice-list-container"></div>
  </div>

  <div id="tab-accounts" class="main-tab-content">
    <div class="section-head has-illust">
      <div class="section-head-text">
        <span class="section-num">02</span>
        <h2>회원 승인</h2>
        <span class="section-note">가입 승인 · 정지 · 비밀번호 초기화</span>
      </div>
      <img class="section-illust" src="img/illust/accounts.svg" width="705" height="712" alt="" decoding="async">
    </div>
    <div class="search-bar">
      <div class="search-wrap">
        <svg><use href="#i-search"></use></svg>
        <input type="text" id="account-search" class="search-input" placeholder="계정(이메일) 또는 이름 검색" aria-label="계정(이메일) 또는 이름 검색" oninput="setAccountSearch(this.value)">
      </div>
    </div>
    <div class="filter-bar">
      <button class="filter-btn active" data-afilter="all" onclick="setAccountFilter('all')">전체</button>
      <button class="filter-btn" data-afilter="pending" onclick="setAccountFilter('pending')">승인 대기</button>
      <button class="filter-btn" data-afilter="approved" onclick="setAccountFilter('approved')">승인됨</button>
      <button class="filter-btn" data-afilter="rejected" onclick="setAccountFilter('rejected')">정지됨</button>
    </div>
    <div id="accounts-list-container"></div>
  </div>
</div>

<!-- 비밀번호 초기화 -->
<div class="pw-overlay" id="pwOverlay">
  <div class="pw-modal">
    <h3 id="pwTitle">비밀번호 초기화</h3>
    <div class="pw-target" id="pwTarget"></div>
    <div id="pwFormArea">
      <label class="pw-label" for="pwNew">새 비밀번호</label>
      <div class="pw-row">
        <input type="text" id="pwNew" placeholder="6자 이상" autocomplete="off" spellcheck="false">
        <button type="button" class="pw-side-btn" onclick="genTempPw()">임시 생성</button>
      </div>
      <div class="pw-msg" id="pwMsg"></div>
    </div>
    <div id="pwDoneArea" style="display:none">
      <label class="pw-label">새 비밀번호 — 본인에게 전달하세요</label>
      <div class="pw-row">
        <input type="text" id="pwDoneValue" readonly>
        <button type="button" class="pw-side-btn" onclick="copyNewPw()">복사</button>
      </div>
      <div class="pw-msg ok" id="pwDoneMsg"></div>
      <div class="pw-note">전달받은 사람이 로그인한 뒤 비밀번호를 바꿀 수 있는 화면은 아직 없습니다. 바꿔주려면 이 버튼을 다시 쓰면 됩니다.</div>
      <div class="pw-actions"><button class="pw-cancel" onclick="closePwReset()">닫기</button></div>
    </div>
    <div class="pw-actions" id="pwActions">
      <button class="pw-cancel" onclick="closePwReset()">취소</button>
      <button class="pw-confirm" id="pwConfirmBtn" onclick="submitPwReset()">초기화</button>
    </div>
  </div>
</div>

<footer>Created by 박정진 &nbsp;|&nbsp; 관리자</footer>

<script>
const SUPABASE_URL = 'https://qvzlwhwxspmofrwdvgdd.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF2emx3aHd4c3Btb2Zyd2R2Z2RkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQxNzcyNDQsImV4cCI6MjA5OTc1MzI0NH0.uMdamJNn-GHRGfcTNnij6gapaG49bnXjC2fk32RcTfg';
const AUTH_EMAIL_DOMAIN = '@skylife-agent.local';
const USERNAME_RE = /^[a-zA-Z0-9_-]{4,20}$/;

const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { storage: window.sessionStorage } });

let allNotices = [];
let noticeSearchQuery = '';
let editingId = null;
let allAccounts = [];
let accountsLoaded = false;
let accountFilter = 'all';
let accountSearchQuery = '';

/* ── 인증 ── */
function togglePw() {
  const inp = document.getElementById('admin-password');
  inp.type = inp.type === 'password' ? 'text' : 'password';
  const use = document.querySelector('#pw-toggle use');
  if (use) use.setAttribute('href', inp.type === 'password' ? '#i-eye' : '#i-eye-off');
}

async function login() {
  const username = document.getElementById('admin-username').value.trim();
  const password = document.getElementById('admin-password').value;
  const errEl = document.getElementById('pw-error');
  errEl.textContent = '';

  if (!USERNAME_RE.test(username) || !password) { errEl.textContent = '아이디와 비밀번호를 입력해주세요'; return; }

  const btn = document.getElementById('login-btn');
  btn.disabled = true; btn.textContent = '로그인 중...';

  const { data, error } = await sb.auth.signInWithPassword({ email: username.toLowerCase() + AUTH_EMAIL_DOMAIN, password });

  if (error) {
    btn.disabled = false; btn.textContent = '로그인';
    errEl.textContent = '아이디 또는 비밀번호가 올바르지 않습니다';
    return;
  }

  const ok = await verifyAdmin(data.user.id);
  btn.disabled = false; btn.textContent = '로그인';

  if (!ok) {
    await sb.auth.signOut();
    errEl.textContent = '관리자 권한이 없는 계정입니다';
    return;
  }

  unlockAdmin();
}

async function verifyAdmin(userId) {
  const { data: profile } = await sb.from('profiles').select('is_admin').eq('id', userId).single();
  return !!(profile && profile.is_admin);
}

function unlockAdmin() {
  document.getElementById('lock-overlay').classList.add('hidden');
  loadNotices();
}

function showLoginForm() {
  document.getElementById('lock-loading').style.display = 'none';
  document.getElementById('login-area').classList.add('show');
  document.getElementById('admin-username').focus();
}

async function logout() {
  await sb.auth.signOut();
  location.reload();
}

async function checkSession() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { showLoginForm(); return; }
  const ok = await verifyAdmin(session.user.id);
  if (ok) { unlockAdmin(); return; }
  await sb.auth.signOut();
  showLoginForm();
}

/* ── 메인 탭 전환 ── */
function switchMainTab(tab) {
  document.querySelectorAll('.main-tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.getElementById('tab-notices').classList.toggle('active', tab === 'notices');
  document.getElementById('tab-accounts').classList.toggle('active', tab === 'accounts');
  if (tab === 'accounts' && !accountsLoaded) loadAccounts();
}

/* ── 공지 작성/수정 ── */
async function submitNotice() {
  const title = document.getElementById('f-title').value.trim();
  const category = document.getElementById('f-category').value;
  const content = document.getElementById('f-content').value.trim();
  const pinned = document.getElementById('f-pinned').checked;

  if (!title || !content) { showFormFeedback('fail', '제목과 내용은 필수 입력 항목입니다.'); return; }

  const btn = document.getElementById('submit-btn');
  btn.disabled = true; btn.textContent = editingId ? '수정 중...' : '등록 중...';

  let error;
  if (editingId) {
    ({ error } = await sb.from('notices').update({ title, category, content, pinned, updated_at: new Date().toISOString() }).eq('id', editingId));
  } else {
    ({ error } = await sb.from('notices').insert({ title, category, content, pinned }));
  }

  btn.disabled = false;

  if (error) { showFormFeedback('fail', '저장 실패. 다시 시도해주세요.'); btn.textContent = editingId ? '수정 저장' : '등록'; return; }

  showFormFeedback('ok', '저장되었습니다.');
  cancelEdit();
  await loadNotices();
}

function startEdit(d) {
  editingId = d.id;
  document.getElementById('form-title').textContent = '공지 수정';
  document.getElementById('f-title').value = d.title;
  document.getElementById('f-category').value = d.category;
  document.getElementById('f-content').value = d.content;
  document.getElementById('f-pinned').checked = !!d.pinned;
  document.getElementById('submit-btn').textContent = '수정 저장';
  document.getElementById('cancel-edit-btn').style.display = 'inline-block';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function cancelEdit() {
  editingId = null;
  document.getElementById('form-title').textContent = '공지 작성';
  document.getElementById('f-title').value = '';
  document.getElementById('f-category').value = '기타';
  document.getElementById('f-content').value = '';
  document.getElementById('f-pinned').checked = false;
  document.getElementById('submit-btn').textContent = '등록';
  document.getElementById('cancel-edit-btn').style.display = 'none';
}

async function deleteNotice(id) {
  if (!confirm('이 공지를 삭제하시겠습니까?')) return;
  const { error } = await sb.from('notices').delete().eq('id', id);
  if (error) { alert('삭제 실패'); return; }
  await loadNotices();
}

function showFormFeedback(type, msg) {
  const el = document.getElementById('form-feedback');
  el.className = 'form-feedback ' + type;
  el.textContent = msg;
  setTimeout(() => { el.textContent = ''; }, 4000);
}

async function loadNotices() {
  setNoticeLoading('불러오는 중...');
  const { data, error } = await sb.from('notices').select('*')
    .order('pinned', { ascending: false })
    .order('created_at', { ascending: false });
  if (error) { setNoticeLoading('불러오기 실패. 새로고침해주세요.'); return; }
  allNotices = data;
  document.getElementById('notice-count').textContent = '전체 ' + data.length + '건';
  renderNoticeList();
}

function setNoticeSearch(q) {
  noticeSearchQuery = q.trim().toLowerCase();
  renderNoticeList();
}

function renderNoticeList() {
  const container = document.getElementById('notice-list-container');
  container.textContent = '';

  const filtered = noticeSearchQuery
    ? allNotices.filter(d =>
        (d.title || '').toLowerCase().includes(noticeSearchQuery) ||
        (d.content || '').toLowerCase().includes(noticeSearchQuery))
    : allNotices;

  if (!filtered.length) {
    const empty = document.createElement('div');
    empty.className = 'empty';
    const icon = document.createElement('div'); icon.className = 'empty-icon'; icon.innerHTML = '<svg><use href="#' + (allNotices.length ? 'i-search' : 'i-inbox') + '"></use></svg>';
    const text = document.createElement('div'); text.className = 'empty-text'; text.textContent = allNotices.length ? '검색 결과가 없습니다.' : '등록된 공지가 없습니다.';
    empty.appendChild(icon); empty.appendChild(text);
    container.appendChild(empty);
    return;
  }
  filtered.forEach(d => container.appendChild(buildNoticeCard(d)));
}

function buildNoticeCard(d) {
  const card = document.createElement('div');
  card.className = 'notice-card' + (d.pinned ? ' pinned' : '');
  card.id = 'notice-' + d.id;

  const date = new Date(d.created_at).toLocaleDateString('ko-KR', { year:'2-digit', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' });

  const head = document.createElement('div');
  head.className = 'card-head';
  head.onclick = () => card.classList.toggle('card-open');

  const info = document.createElement('div');
  info.className = 'card-head-info';

  const top = document.createElement('div');
  top.className = 'card-top';
  const catBadge = document.createElement('span');
  catBadge.className = 'cat-badge';
  catBadge.textContent = d.category;
  const viewBadge = document.createElement('span');
  viewBadge.className = 'view-badge';
  viewBadge.textContent = '조회 ' + d.view_count;
  top.appendChild(catBadge); top.appendChild(viewBadge);
  if (d.pinned) {
    const pinBadge = document.createElement('span');
    pinBadge.className = 'pin-badge';
    pinBadge.innerHTML = '<svg><use href="#i-pin"></use></svg>고정';
    top.appendChild(pinBadge);
  }

  const title = document.createElement('div');
  title.className = 'card-title';
  title.textContent = d.title;

  const meta = document.createElement('div');
  meta.className = 'card-meta';
  meta.textContent = date + (d.updated_at ? ' (수정됨)' : '');

  info.appendChild(top); info.appendChild(title); info.appendChild(meta);

  const chevron = document.createElement('span');
  chevron.className = 'card-chevron';
  chevron.innerHTML = '<svg><use href="#i-chevron"></use></svg>';

  head.appendChild(info); head.appendChild(chevron);

  const body = document.createElement('div');
  body.className = 'card-body';

  const text = document.createElement('div');
  text.className = 'body-text';
  text.textContent = d.content;
  body.appendChild(text);

  const actions = document.createElement('div');
  actions.className = 'card-actions';
  const editBtn = document.createElement('button');
  editBtn.className = 'action-btn';
  editBtn.textContent = '수정';
  editBtn.onclick = (e) => { e.stopPropagation(); startEdit(d); };
  const delBtn = document.createElement('button');
  delBtn.className = 'action-btn';
  delBtn.textContent = '삭제';
  delBtn.onclick = (e) => { e.stopPropagation(); deleteNotice(d.id); };
  actions.appendChild(editBtn); actions.appendChild(delBtn);
  body.appendChild(actions);

  card.appendChild(head);
  card.appendChild(body);
  return card;
}

function setNoticeLoading(msg) {
  const el = document.createElement('div'); el.className = 'loading'; el.textContent = msg;
  const c = document.getElementById('notice-list-container'); c.textContent = ''; c.appendChild(el);
}

/* ── 회원 승인 ── */
async function loadAccounts() {
  const { data, error } = await sb.rpc('admin_list_accounts');
  if (error) { alert('회원 목록을 불러오지 못했습니다.\n' + (error.message || JSON.stringify(error))); return; }
  allAccounts = data || [];
  accountsLoaded = true;
  renderAccounts();
}

function setAccountFilter(f) {
  accountFilter = f;
  document.querySelectorAll('[data-afilter]').forEach(b => b.classList.toggle('active', b.dataset.afilter === f));
  renderAccounts();
}

function setAccountSearch(q) {
  accountSearchQuery = q.trim().toLowerCase();
  renderAccounts();
}

function renderAccounts() {
  let filtered = accountFilter === 'all' ? allAccounts : allAccounts.filter(a => a.status === accountFilter);
  if (accountSearchQuery) {
    filtered = filtered.filter(a =>
      (a.name || '').toLowerCase().includes(accountSearchQuery) ||
      (a.email || '').toLowerCase().includes(accountSearchQuery)
    );
  }
  const container = document.getElementById('accounts-list-container');
  container.textContent = '';

  if (!filtered.length) {
    const empty = document.createElement('div');
    empty.className = 'empty';
    const icon = document.createElement('div'); icon.className = 'empty-icon'; icon.innerHTML = '<svg><use href="#i-user"></use></svg>';
    const text = document.createElement('div'); text.className = 'empty-text'; text.textContent = '해당하는 계정이 없습니다.';
    empty.appendChild(icon); empty.appendChild(text);
    container.appendChild(empty);
    return;
  }
  filtered.forEach(a => container.appendChild(buildAccountCard(a)));
}

function buildAccountCard(a) {
  const card = document.createElement('div');
  card.className = 'account-card';

  const info = document.createElement('div');
  info.className = 'account-info';
  const nameRow = document.createElement('div');
  nameRow.className = 'account-name-row';
  const name = document.createElement('span'); name.className = 'account-name'; name.textContent = a.name;
  const code = document.createElement('span'); code.className = 'account-code'; code.textContent = a.agency_code;
  const statusBadge = document.createElement('span');
  statusBadge.className = 'status-badge ' + (a.status === 'approved' ? 'answered' : a.status === 'rejected' ? 'rejected' : 'pending');
  statusBadge.textContent = a.status === 'approved' ? '승인됨' : a.status === 'rejected' ? '정지됨' : '승인대기';
  nameRow.appendChild(name); nameRow.appendChild(code); nameRow.appendChild(statusBadge);

  const meta = document.createElement('div');
  meta.className = 'account-meta';
  meta.textContent = a.agency_name;

  const date = document.createElement('div');
  date.className = 'account-date';
  date.textContent = new Date(a.created_at).toLocaleDateString('ko-KR', { year:'2-digit', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' }) + ' 가입';

  info.appendChild(nameRow); info.appendChild(meta); info.appendChild(date);

  const actions = document.createElement('div');
  actions.className = 'account-actions';
  const approveBtn = document.createElement('button');
  // 승인 대기 계정의 '승인'만 붉은 주 버튼 — 지금 처리해야 할 일이 한눈에 보이게
  approveBtn.className = 'account-btn approve' + (a.status === 'pending' ? ' primary' : '');
  approveBtn.textContent = '승인';
  approveBtn.disabled = a.status === 'approved';
  approveBtn.onclick = () => setAccountStatus(a.id, 'approved');
  const rejectBtn = document.createElement('button');
  rejectBtn.className = 'account-btn reject';
  rejectBtn.textContent = '정지';
  rejectBtn.disabled = a.status === 'rejected';
  rejectBtn.onclick = () => setAccountStatus(a.id, 'rejected');
  const resetBtn = document.createElement('button');
  resetBtn.className = 'account-btn reset';
  resetBtn.textContent = '비밀번호 초기화';
  resetBtn.onclick = () => openPwReset(a);
  actions.appendChild(approveBtn); actions.appendChild(rejectBtn); actions.appendChild(resetBtn);

  card.appendChild(info); card.appendChild(actions);
  return card;
}

async function setAccountStatus(id, status) {
  const { error } = await sb.rpc('admin_set_status', { account_id: id, new_status: status });
  if (error) { alert('처리 실패. 다시 시도해주세요.\n' + (error.message || JSON.stringify(error))); return; }
  const { data } = await sb.rpc('admin_list_accounts');
  allAccounts = data || allAccounts;
  renderAccounts();
}

/* ── 비밀번호 초기화 ── */
let pwResetTarget = null;

function openPwReset(account) {
  pwResetTarget = account;
  const loginId = (account.email || '').split('@')[0];
  document.getElementById('pwTitle').textContent = '비밀번호 초기화';
  document.getElementById('pwTarget').innerHTML =
    '<b>' + escapeHtml(account.name) + '</b> · ' + escapeHtml(account.agency_name) +
    '<br>아이디 <b>' + escapeHtml(loginId) + '</b>';
  document.getElementById('pwFormArea').style.display = '';
  document.getElementById('pwDoneArea').style.display = 'none';
  document.getElementById('pwActions').style.display = '';
  document.getElementById('pwNew').value = '';
  setPwMsg('', '');
  const btn = document.getElementById('pwConfirmBtn');
  btn.disabled = false; btn.textContent = '초기화';
  document.getElementById('pwOverlay').classList.add('open');
  document.getElementById('pwNew').focus();
}

function closePwReset() {
  document.getElementById('pwOverlay').classList.remove('open');
  pwResetTarget = null;
}

function escapeHtml(t) {
  const d = document.createElement('div');
  d.textContent = t == null ? '' : t;
  return d.innerHTML;
}

function setPwMsg(type, text) {
  const el = document.getElementById('pwMsg');
  el.className = 'pw-msg' + (type ? ' ' + type : '');
  el.textContent = text;
}

function genTempPw() {
  // 헷갈리는 글자(0 O o l 1 I)는 뺀다 — 구두로 전달할 일이 많다
  const chars = 'abcdefghijkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  const buf = new Uint32Array(10);
  crypto.getRandomValues(buf);
  const pw = Array.from(buf, n => chars[n % chars.length]).join('');
  document.getElementById('pwNew').value = pw;
  setPwMsg('', '');
}

async function submitPwReset() {
  if (!pwResetTarget) return;
  const pw = document.getElementById('pwNew').value.trim();
  if (pw.length < 6) { setPwMsg('error', '비밀번호는 6자 이상 입력해주세요'); return; }

  const btn = document.getElementById('pwConfirmBtn');
  btn.disabled = true; btn.textContent = '처리 중...';

  const { error } = await sb.rpc('admin_reset_password', {
    account_id: pwResetTarget.id,
    new_password: pw
  });

  if (error) {
    btn.disabled = false; btn.textContent = '초기화';
    const m = (error.message || '') + ' ' + (error.code || '');
    if (/unauthorized/i.test(m))            setPwMsg('error', '관리자 권한이 없습니다. 다시 로그인해주세요.');
    else if (/password too short/i.test(m)) setPwMsg('error', '비밀번호는 6자 이상이어야 합니다.');
    else if (/account not found/i.test(m))  setPwMsg('error', '대상 계정을 찾을 수 없습니다. 목록을 새로고침해주세요.');
    else if (/PGRST202|does not exist|Could not find the function/i.test(m))
      setPwMsg('error', 'admin_reset_password 함수가 없습니다. schema_password_reset.sql을 먼저 실행해주세요.');
    else setPwMsg('error', '처리 실패: ' + (error.message || JSON.stringify(error)));
    return;
  }

  const loginId = (pwResetTarget.email || '').split('@')[0];
  document.getElementById('pwFormArea').style.display = 'none';
  document.getElementById('pwActions').style.display = 'none';
  document.getElementById('pwDoneArea').style.display = '';
  document.getElementById('pwTitle').textContent = '초기화했습니다';
  document.getElementById('pwDoneValue').value = pw;
  document.getElementById('pwDoneMsg').textContent =
    '아이디 ' + loginId + ' 로 바로 로그인할 수 있습니다.';
}

async function copyNewPw() {
  const el = document.getElementById('pwDoneValue');
  try {
    await navigator.clipboard.writeText(el.value);
    document.getElementById('pwDoneMsg').textContent = '복사했습니다.';
  } catch (e) {
    el.select(); el.setSelectionRange(0, 99);
    document.getElementById('pwDoneMsg').textContent = '직접 복사해주세요 (Cmd/Ctrl + C).';
  }
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closePwReset();
  if (e.key === 'Enter' && document.getElementById('pwOverlay').classList.contains('open')
      && document.getElementById('pwFormArea').style.display !== 'none') {
    submitPwReset();
  }
});

/* ── 초기화 ── */
window.addEventListener('DOMContentLoaded', () => {
  checkSession();
});
</script>
