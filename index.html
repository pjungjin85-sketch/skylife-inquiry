<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>kt skylife 공지사항</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" integrity="sha384-0w2KAL2YHP6wKOkUDzkCDGgVvfmHnj02DHeQ6XcHOgTfFsGyonKOpShMH1x6nk9o" crossorigin="anonymous"></script>
<style>
:root {
  --red: #E60012; --red2: #CC0010; --red-light: #FFF5F5; --red-border: #FFCCCC;
  --black: #1A1A1A; --dark: #333333; --mid: #666666; --light: #999999;
  --bg: #FFFFFF; --bg2: #F7F7F7; --bg3: #FAFAFA; --border: #E8E8E8;
  --shadow: 0 2px 12px rgba(0,0,0,0.08); --shadow-hover: 0 8px 28px rgba(0,0,0,0.14);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Noto Sans KR', sans-serif; background: var(--bg2); color: var(--black); min-height: 100vh; }

header { background: var(--bg); border-top: 3px solid var(--red); border-bottom: 1px solid var(--border); padding: 0 20px; position: sticky; top: 0; z-index: 200; box-shadow: var(--shadow); }
.header-inner { max-width: 720px; margin: 0 auto; display: flex; align-items: center; height: 56px; gap: 12px; }
.logo-text { font-size: 18px; font-weight: 900; color: var(--black); letter-spacing: -.02em; }
.logo-text span { color: var(--red); }
.header-badge { background: var(--red); color: #fff; font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 3px; letter-spacing: .04em; }
.header-title { font-size: 15px; font-weight: 700; color: var(--dark); }
.header-count { font-size: 12px; color: var(--light); margin-left: auto; white-space: nowrap; }

.content { max-width: 720px; margin: 0 auto; padding: 24px 20px; }

.list-header { display: flex; align-items: center; justify-content: flex-end; margin-bottom: 16px; }
.refresh-btn { padding: 6px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 12px; color: var(--mid); background: var(--bg); cursor: pointer; font-family: inherit; }
.refresh-btn:hover { border-color: var(--red); color: var(--red); }

/* 목록 화면 (표) */
.table-wrap { overflow-x: auto; background: var(--bg); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow); }
.notice-table { width: 100%; border-collapse: collapse; min-width: 480px; }
.notice-table th { background: var(--bg3); font-size: 12px; font-weight: 700; color: var(--mid); padding: 12px 10px; border-bottom: 1px solid var(--border); text-align: center; white-space: nowrap; }
.notice-table td { padding: 13px 10px; border-bottom: 1px solid var(--border); font-size: 13px; color: var(--dark); text-align: center; }
.notice-table tbody tr:last-child td { border-bottom: none; }
.notice-table tbody tr:hover td { background: var(--bg3); }
.notice-table tr.pinned-row td { background: var(--red-light); }
.notice-table tr.pinned-row:hover td { background: var(--red-light); }
.col-no { width: 56px; }
.col-cat { width: 88px; }
.col-title { text-align: left; }
.col-view { width: 76px; }
.cat-badge { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 3px; background: var(--red-light); color: var(--red); border: 1px solid var(--red-border); white-space: nowrap; }
.title-wrap { display: flex; align-items: baseline; gap: 8px; text-align: left; }
.title-link { color: var(--black); font-weight: 700; cursor: pointer; white-space: nowrap; text-align: left; }
.title-link:hover { color: var(--red); text-decoration: underline; }
.content-preview { font-size: 12px; color: var(--light); font-weight: 400; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }

/* 상세 화면 */
#pane-detail { display: none; }
.back-btn { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; color: var(--mid); background: none; border: none; cursor: pointer; font-family: inherit; margin-bottom: 16px; padding: 4px 0; }
.back-btn:hover { color: var(--red); }
.detail-card { background: var(--bg); border: 1px solid var(--border); border-radius: 16px; padding: 28px 24px; box-shadow: var(--shadow); }
.detail-top { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.detail-title { font-size: 18px; font-weight: 900; color: var(--black); line-height: 1.4; margin-bottom: 10px; }
.detail-meta { font-size: 12px; color: var(--light); display: flex; gap: 12px; padding-bottom: 18px; margin-bottom: 18px; border-bottom: 1px solid var(--border); }
.detail-content { font-size: 14px; color: var(--dark); line-height: 1.8; white-space: pre-wrap; }

.loading { text-align: center; padding: 48px 20px; color: var(--light); font-size: 14px; }
.empty { text-align: center; padding: 48px 20px; }
.empty-icon { font-size: 40px; margin-bottom: 12px; }
.empty-text { font-size: 14px; color: var(--light); }

footer { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-top: 1px solid var(--border); text-align: center; padding: 10px; font-size: 11px; color: #666666; z-index: 50; }

@media (max-width: 480px) {
  .content { padding: 16px 14px; }
}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <span class="logo-text">kt <span>skylife</span></span>
    <span class="header-badge">MOBILE</span>
    <span class="header-title">공지사항</span>
    <span class="header-count" id="count-label"></span>
  </div>
</header>

<div class="content" id="pane-list">
  <div class="list-header">
    <button class="refresh-btn" onclick="loadList()">↺ 새로고침</button>
  </div>
  <div class="table-wrap">
    <table class="notice-table">
      <thead>
        <tr>
          <th class="col-no">No</th>
          <th class="col-cat">분류</th>
          <th class="col-title">제목</th>
          <th class="col-content">내용</th>
          <th class="col-view">조회수</th>
        </tr>
      </thead>
      <tbody id="list-container"></tbody>
    </table>
  </div>
</div>

<div class="content" id="pane-detail">
  <button class="back-btn" onclick="showList()">← 목록으로</button>
  <div class="detail-card" id="detail-container"></div>
</div>

<footer>Created by 박정진 &nbsp;|&nbsp; 공지사항</footer>

<script>
const SUPABASE_URL = 'https://qvzlwhwxspmofrwdvgdd.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF2emx3aHd4c3Btb2Zyd2R2Z2RkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQxNzcyNDQsImV4cCI6MjA5OTc1MzI0NH0.uMdamJNn-GHRGfcTNnij6gapaG49bnXjC2fk32RcTfg';
const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

let allNotices = [];

function showList() {
  document.getElementById('pane-detail').style.display = 'none';
  document.getElementById('pane-list').style.display = 'block';
}

async function loadList() {
  const container = document.getElementById('list-container');
  setLoading(container, '불러오는 중...');

  const { data, error } = await sb.from('notices').select('*')
    .order('pinned', { ascending: false })
    .order('created_at', { ascending: false });

  if (error) { setLoading(container, '불러오기 실패. 새로고침을 눌러주세요.'); return; }

  allNotices = data;
  document.getElementById('count-label').textContent = '전체 ' + data.length + '건';

  container.textContent = '';

  if (!data.length) {
    const tr = document.createElement('tr');
    const td = document.createElement('td');
    td.colSpan = 4;
    td.className = 'empty';
    const icon = document.createElement('div'); icon.className = 'empty-icon'; icon.textContent = '📭';
    const text = document.createElement('div'); text.className = 'empty-text'; text.textContent = '등록된 공지가 없습니다.';
    td.appendChild(icon); td.appendChild(text);
    tr.appendChild(td);
    container.appendChild(tr);
    return;
  }

  let seq = 0;
  data.forEach(d => {
    if (!d.pinned) seq++;
    container.appendChild(buildRow(d, seq));
  });
}

function buildRow(d, seq) {
  const tr = document.createElement('tr');
  if (d.pinned) tr.classList.add('pinned-row');

  const noTd = document.createElement('td');
  noTd.className = 'col-no';
  noTd.textContent = d.pinned ? '📌' : String(seq);

  const catTd = document.createElement('td');
  catTd.className = 'col-cat';
  const catBadge = document.createElement('span');
  catBadge.className = 'cat-badge';
  catBadge.textContent = d.category;
  catTd.appendChild(catBadge);

  const titleTd = document.createElement('td');
  titleTd.className = 'col-title';
  const titleWrap = document.createElement('div');
  titleWrap.className = 'title-wrap';
  const titleLink = document.createElement('span');
  titleLink.className = 'title-link';
  titleLink.textContent = d.title;
  titleLink.onclick = () => openDetail(d.id);
  const preview = document.createElement('span');
  preview.className = 'content-preview';
  preview.textContent = truncateContent(d.content, 20);
  titleWrap.appendChild(titleLink);
  titleWrap.appendChild(preview);
  titleTd.appendChild(titleWrap);

  const viewTd = document.createElement('td');
  viewTd.className = 'col-view';
  viewTd.textContent = d.view_count;

  tr.appendChild(noTd);
  tr.appendChild(catTd);
  tr.appendChild(titleTd);
  tr.appendChild(viewTd);
  return tr;
}

async function openDetail(id) {
  const notice = allNotices.find(n => n.id === id);
  if (!notice) return;

  document.getElementById('pane-list').style.display = 'none';
  document.getElementById('pane-detail').style.display = 'block';
  renderDetail(notice);

  const { error } = await sb.rpc('increment_notice_view', { notice_id: id });
  if (!error) {
    notice.view_count += 1;
    const localCopy = allNotices.find(n => n.id === id);
    if (localCopy) localCopy.view_count = notice.view_count;
    renderDetail(notice);
  }
}

function renderDetail(d) {
  const container = document.getElementById('detail-container');
  container.textContent = '';

  const top = document.createElement('div');
  top.className = 'detail-top';
  const catBadge = document.createElement('span');
  catBadge.className = 'cat-badge';
  catBadge.textContent = d.category;
  top.appendChild(catBadge);

  const title = document.createElement('div');
  title.className = 'detail-title';
  title.textContent = d.title;

  const date = new Date(d.created_at).toLocaleDateString('ko-KR', { year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' });
  const meta = document.createElement('div');
  meta.className = 'detail-meta';
  const dateSpan = document.createElement('span');
  dateSpan.textContent = date + (d.updated_at ? ' (수정됨)' : '');
  const viewSpan = document.createElement('span');
  viewSpan.textContent = '조회 ' + d.view_count;
  meta.appendChild(dateSpan);
  meta.appendChild(viewSpan);

  const content = document.createElement('div');
  content.className = 'detail-content';
  content.textContent = d.content;

  container.appendChild(top);
  container.appendChild(title);
  container.appendChild(meta);
  container.appendChild(content);
}

function truncateContent(text, len) {
  if (!text) return '';
  const trimmed = text.trim().replace(/\s+/g, ' ');
  return trimmed.length > len ? trimmed.slice(0, len) + '…' : trimmed;
}

function setLoading(container, msg) {
  container.textContent = '';
  const tr = document.createElement('tr');
  const td = document.createElement('td');
  td.colSpan = 4;
  td.className = 'loading';
  td.textContent = msg;
  tr.appendChild(td);
  container.appendChild(tr);
}

loadList();
</script>
</body>
</html>
