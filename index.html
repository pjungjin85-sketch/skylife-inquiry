<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs>
<symbol id="i-back" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5m0 0 6-6m-6 6 6 6"/></symbol>
<symbol id="i-refresh" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 12a8.5 8.5 0 1 1 2.6 6.1"/><path d="M3.5 19v-5h5"/></symbol>
<symbol id="i-pin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3.5h6l-.8 5.2 3.3 3.3H6.5l3.3-3.3z"/><path d="M12 12v8.5"/></symbol>
<symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7.5"/><path d="m16.5 16.5 4 4"/></symbol>
<symbol id="i-inbox" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 13.5h4l1.5 3h6l1.5-3h4"/><path d="M5.3 5.2 3.5 13.5v3.8a2 2 0 0 0 2 2h13a2 2 0 0 0 2-2v-3.8L18.7 5.2a2 2 0 0 0-1.8-1.2H7.1a2 2 0 0 0-1.8 1.2z"/></symbol>
<symbol id="i-user" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4.5 20.5a7.5 7.5 0 0 1 15 0"/></symbol>
<symbol id="i-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9.5 6 6 6-6"/></symbol>
<symbol id="i-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/></symbol>
<symbol id="i-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 5.8A8.6 8.6 0 0 1 12 5.5c6 0 9.5 6.5 9.5 6.5a16 16 0 0 1-2.6 3.5M6.3 7.9A16 16 0 0 0 2.5 12S6 18.5 12 18.5a8.8 8.8 0 0 0 3.2-.6"/><path d="M10 10a3 3 0 0 0 4.2 4.2M3.5 3.5l17 17"/></symbol>

<header>
  <div class="header-inner">
    <span class="logo-text">kt <span>skylife</span></span>
    <span class="header-badge">대리점 전용</span>
    <span class="header-title">공지사항</span>
    <span class="header-count" id="count-label"></span>
    <a href="https://skylife-guide-jyac.vercel.app/" class="guide-home-btn"><svg><use href="#i-back"></use></svg>가이드로</a>
  </div>
</header>

<div class="content" id="pane-list">
  <div class="list-header">
    <input type="text" id="notice-search" class="search-input" placeholder="제목 또는 내용 검색" oninput="filterNotices(this.value)">
    <button class="refresh-btn" onclick="loadList()"><svg><use href="#i-refresh"></use></svg>새로고침</button>
  </div>
  <div class="table-wrap">
    <table class="notice-table">
      <thead>
        <tr>
          <th class="col-no">No</th>
          <th class="col-date">등록일</th>
          <th class="col-cat">분류</th>
          <th class="col-title">제목</th>
          <th class="col-content">내용</th>
          <th class="col-view">조회수</th>
        </tr>
      </thead>
      <tbody id="list-container"></tbody>
    </table>
  </div>
</div>

<div class="content" id="pane-detail">
  <button class="back-btn" onclick="showList()"><svg><use href="#i-back"></use></svg>목록으로</button>
  <div class="detail-card" id="detail-container"></div>
</div>

<footer>Created by 박정진 &nbsp;|&nbsp; 공지사항</footer>

<script>
const SUPABASE_URL = 'https://qvzlwhwxspmofrwdvgdd.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF2emx3aHd4c3Btb2Zyd2R2Z2RkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQxNzcyNDQsImV4cCI6MjA5OTc1MzI0NH0.uMdamJNn-GHRGfcTNnij6gapaG49bnXjC2fk32RcTfg';
const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

let allNotices = [];
let noticeSearchQuery = '';

function showList() {
  document.getElementById('pane-detail').style.display = 'none';
  document.getElementById('pane-list').style.display = 'block';
}

async function loadList() {
  const container = document.getElementById('list-container');
  setLoading(container, '불러오는 중...');

  const { data, error } = await sb.from('notices').select('*')
    .order('pinned', { ascending: false })
    .order('created_at', { ascending: false });

  if (error) { setLoading(container, '불러오기 실패. 새로고침을 눌러주세요.'); return; }

  allNotices = data;
  document.getElementById('count-label').textContent = '전체 ' + data.length + '건';
  renderList();
}

function filterNotices(q) {
  noticeSearchQuery = q.trim().toLowerCase();
  renderList();
}

function renderList() {
  const container = document.getElementById('list-container');
  container.textContent = '';

  const filtered = noticeSearchQuery
    ? allNotices.filter(d =>
        (d.title || '').toLowerCase().includes(noticeSearchQuery) ||
        (d.content || '').toLowerCase().includes(noticeSearchQuery))
    : allNotices;

  if (!filtered.length) {
    const tr = document.createElement('tr');
    const td = document.createElement('td');
    td.colSpan = 6;
    td.className = 'empty';
    const icon = document.createElement('div'); icon.className = 'empty-icon'; icon.innerHTML = '<svg><use href="#' + (allNotices.length ? 'i-search' : 'i-inbox') + '"></use></svg>';
    const text = document.createElement('div'); text.className = 'empty-text'; text.textContent = allNotices.length ? '검색 결과가 없습니다.' : '등록된 공지가 없습니다.';
    td.appendChild(icon); td.appendChild(text);
    tr.appendChild(td);
    container.appendChild(tr);
    return;
  }

  let seq = 0;
  filtered.forEach(d => {
    if (!d.pinned) seq++;
    container.appendChild(buildRow(d, seq));
  });
}

function buildRow(d, seq) {
  const tr = document.createElement('tr');
  if (d.pinned) tr.classList.add('pinned-row');

  const noTd = document.createElement('td');
  noTd.className = 'col-no';
  if(d.pinned){ noTd.innerHTML = '<span class="pin-badge"><svg><use href="#i-pin"></use></svg></span>'; } else { noTd.textContent = String(seq); }

  const catTd = document.createElement('td');
  catTd.className = 'col-cat';
  const catBadge = document.createElement('span');
  catBadge.className = 'cat-badge';
  catBadge.textContent = d.category;
  catTd.appendChild(catBadge);

  const titleTd = document.createElement('td');
  titleTd.className = 'col-title';
  const titleLink = document.createElement('span');
  titleLink.className = 'title-link';
  titleLink.textContent = d.title;
  titleLink.onclick = () => openDetail(d.id);
  titleTd.appendChild(titleLink);

  const contentTd = document.createElement('td');
  contentTd.className = 'col-content';
  const preview = document.createElement('span');
  preview.className = 'content-preview';
  preview.textContent = truncateContent(d.content, 20);
  contentTd.appendChild(preview);

  const dateTd = document.createElement('td');
  dateTd.className = 'col-date';
  dateTd.textContent = new Date(d.created_at).toLocaleDateString('ko-KR', { year: '2-digit', month: '2-digit', day: '2-digit' });

  const viewTd = document.createElement('td');
  viewTd.className = 'col-view';
  viewTd.textContent = d.view_count;

  tr.appendChild(noTd);
  tr.appendChild(dateTd);
  tr.appendChild(catTd);
  tr.appendChild(titleTd);
  tr.appendChild(contentTd);
  tr.appendChild(viewTd);
  return tr;
}

async function openDetail(id) {
  const notice = allNotices.find(n => n.id === id);
  if (!notice) return;

  document.getElementById('pane-list').style.display = 'none';
  document.getElementById('pane-detail').style.display = 'block';
  renderDetail(notice);

  const { error } = await sb.rpc('increment_notice_view', { notice_id: id });
  if (!error) {
    notice.view_count += 1;
    const localCopy = allNotices.find(n => n.id === id);
    if (localCopy) localCopy.view_count = notice.view_count;
    renderDetail(notice);
  }
}

function renderDetail(d) {
  const container = document.getElementById('detail-container');
  container.textContent = '';

  const top = document.createElement('div');
  top.className = 'detail-top';
  const catBadge = document.createElement('span');
  catBadge.className = 'cat-badge';
  catBadge.textContent = d.category;
  top.appendChild(catBadge);

  const title = document.createElement('div');
  title.className = 'detail-title';
  title.textContent = d.title;

  const date = new Date(d.created_at).toLocaleDateString('ko-KR', { year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' });
  const meta = document.createElement('div');
  meta.className = 'detail-meta';
  const dateSpan = document.createElement('span');
  dateSpan.textContent = date + (d.updated_at ? ' (수정됨)' : '');
  const viewSpan = document.createElement('span');
  viewSpan.textContent = '조회 ' + d.view_count;
  meta.appendChild(dateSpan);
  meta.appendChild(viewSpan);

  const content = document.createElement('div');
  content.className = 'detail-content';
  content.textContent = d.content;

  container.appendChild(top);
  container.appendChild(title);
  container.appendChild(meta);
  container.appendChild(content);
}

function truncateContent(text, len) {
  if (!text) return '';
  const trimmed = text.trim().replace(/\s+/g, ' ');
  return trimmed.length > len ? trimmed.slice(0, len) + '…' : trimmed;
}

function setLoading(container, msg) {
  container.textContent = '';
  const tr = document.createElement('tr');
  const td = document.createElement('td');
  td.colSpan = 6;
  td.className = 'loading';
  td.textContent = msg;
  tr.appendChild(td);
  container.appendChild(tr);
}

loadList();
</script>
</body>
</html>
