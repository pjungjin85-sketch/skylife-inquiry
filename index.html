<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>kt skylife 공지사항</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" integrity="sha384-0w2KAL2YHP6wKOkUDzkCDGgVvfmHnj02DHeQ6XcHOgTfFsGyonKOpShMH1x6nk9o" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.4/dist/purify.min.js" integrity="sha384-eEu5CTj3qGvu9PdJuS+YlkNi7d2XxQROAFYOr59zgObtlcux1ae1Il3u7jvdCSWu" crossorigin="anonymous"></script>
<style>
:root {
  --red: #E60012; --red2: #CC0010; --red-light: #FFF5F5; --red-border: #FFCCCC;
  --black: #1A1A1A; --dark: #333333; --mid: #666666; --light: #999999;
  --bg: #FFFFFF; --bg2: #F7F7F7; --bg3: #FAFAFA; --border: #E8E8E8;
  --shadow: 0 2px 12px rgba(0,0,0,0.08); --shadow-hover: 0 8px 28px rgba(0,0,0,0.14);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Noto Sans KR', sans-serif; background: var(--bg2); color: var(--black); min-height: 100vh; }

header { background: var(--bg); border-top: 3px solid var(--red); border-bottom: 1px solid var(--border); padding: 0 20px; position: sticky; top: 0; z-index: 200; box-shadow: var(--shadow); }
.header-inner { max-width: 720px; margin: 0 auto; display: flex; align-items: center; height: 56px; gap: 12px; }
.logo-text { font-size: 18px; font-weight: 900; color: var(--black); letter-spacing: -.02em; }
.logo-text span { color: var(--red); }
.header-badge { background: var(--red); color: #fff; font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 3px; letter-spacing: .04em; }
.header-title { font-size: 15px; font-weight: 700; color: var(--dark); }
.header-count { font-size: 12px; color: var(--light); margin-left: auto; white-space: nowrap; }

.content { max-width: 720px; margin: 0 auto; padding: 24px 20px; }

.list-header { display: flex; align-items: center; justify-content: flex-end; margin-bottom: 16px; }
.refresh-btn { padding: 6px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 12px; color: var(--mid); background: var(--bg); cursor: pointer; font-family: inherit; }
.refresh-btn:hover { border-color: var(--red); color: var(--red); }

/* 목록 화면 */
.notice-row { background: var(--bg); border: 1px solid var(--border); border-radius: 14px; margin-bottom: 10px; padding: 16px 18px; cursor: pointer; box-shadow: var(--shadow); transition: box-shadow .2s; }
.notice-row:hover { box-shadow: var(--shadow-hover); }
.row-top { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }
.cat-badge { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 3px; background: var(--red-light); color: var(--red); border: 1px solid var(--red-border); }
.row-title { font-size: 14px; font-weight: 700; color: var(--black); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-meta { font-size: 11px; color: var(--light); display: flex; gap: 10px; }

/* 상세 화면 */
#pane-detail { display: none; }
.back-btn { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; color: var(--mid); background: none; border: none; cursor: pointer; font-family: inherit; margin-bottom: 16px; padding: 4px 0; }
.back-btn:hover { color: var(--red); }
.detail-card { background: var(--bg); border: 1px solid var(--border); border-radius: 16px; padding: 28px 24px; box-shadow: var(--shadow); }
.detail-top { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.detail-title { font-size: 18px; font-weight: 900; color: var(--black); line-height: 1.4; margin-bottom: 10px; }
.detail-meta { font-size: 12px; color: var(--light); display: flex; gap: 12px; padding-bottom: 18px; margin-bottom: 18px; border-bottom: 1px solid var(--border); }
.detail-content { font-size: 14px; color: var(--dark); line-height: 1.8; white-space: pre-wrap; }

.loading { text-align: center; padding: 48px 20px; color: var(--light); font-size: 14px; }
.empty { text-align: center; padding: 48px 20px; }
.empty-icon { font-size: 40px; margin-bottom: 12px; }
.empty-text { font-size: 14px; color: var(--light); }

footer { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-top: 1px solid var(--border); text-align: center; padding: 10px; font-size: 11px; color: #666666; z-index: 50; }

@media (max-width: 480px) {
  .content { padding: 16px 14px; }
}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <span class="logo-text">kt <span>skylife</span></span>
    <span class="header-badge">대리점 전용</span>
    <span class="header-title">공지사항</span>
    <span class="header-count" id="count-label"></span>
  </div>
</header>

<div class="content" id="pane-list">
  <div class="list-header">
    <button class="refresh-btn" onclick="loadList()">↺ 새로고침</button>
  </div>
  <div id="list-container"></div>
</div>

<div class="content" id="pane-detail">
  <button class="back-btn" onclick="showList()">← 목록으로</button>
  <div class="detail-card" id="detail-container"></div>
</div>

<footer>Created by 박정진 &nbsp;|&nbsp; 공지사항</footer>

<script>
const SUPABASE_URL = 'https://zeiygknvggokauetgrzk.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InplaXlna252Z2dva2F1ZXRncnprIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUxNjE4NzgsImV4cCI6MjA5MDczNzg3OH0.hTipybUz3nfgy_J2sSonwU8FOtM8Tvh4idsvPNx2OF4';
const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

let allNotices = [];

function showList() {
  document.getElementById('pane-detail').style.display = 'none';
  document.getElementById('pane-list').style.display = 'block';
}

async function loadList() {
  const container = document.getElementById('list-container');
  setLoading(container, '불러오는 중...');

  const { data, error } = await sb.from('notices').select('*').order('created_at', { ascending: false });

  if (error) { setLoading(container, '불러오기 실패. 새로고침을 눌러주세요.'); return; }

  allNotices = data;
  document.getElementById('count-label').textContent = '전체 ' + data.length + '건';

  if (!data.length) {
    container.textContent = '';
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.innerHTML = DOMPurify.sanitize('<div class="empty-icon">📭</div><div class="empty-text">등록된 공지가 없습니다.</div>');
    container.appendChild(empty);
    return;
  }

  container.textContent = '';
  data.forEach(d => container.appendChild(buildRow(d)));
}

function buildRow(d) {
  const row = document.createElement('div');
  row.className = 'notice-row';
  row.onclick = () => openDetail(d.id);

  const date = new Date(d.created_at).toLocaleDateString('ko-KR', { month:'2-digit', day:'2-digit' });

  const top = document.createElement('div');
  top.className = 'row-top';
  const catBadge = document.createElement('span');
  catBadge.className = 'cat-badge';
  catBadge.textContent = d.category;
  const title = document.createElement('span');
  title.className = 'row-title';
  title.textContent = d.title;
  top.appendChild(catBadge);
  top.appendChild(title);

  const meta = document.createElement('div');
  meta.className = 'row-meta';
  const dateSpan = document.createElement('span');
  dateSpan.textContent = date;
  const viewSpan = document.createElement('span');
  viewSpan.textContent = '조회 ' + d.view_count;
  meta.appendChild(dateSpan);
  meta.appendChild(viewSpan);

  row.appendChild(top);
  row.appendChild(meta);
  return row;
}

async function openDetail(id) {
  const notice = allNotices.find(n => n.id === id);
  if (!notice) return;

  document.getElementById('pane-list').style.display = 'none';
  document.getElementById('pane-detail').style.display = 'block';
  renderDetail(notice);

  const { error } = await sb.rpc('increment_notice_view', { notice_id: id });
  if (!error) {
    notice.view_count += 1;
    const localCopy = allNotices.find(n => n.id === id);
    if (localCopy) localCopy.view_count = notice.view_count;
    renderDetail(notice);
  }
}

function renderDetail(d) {
  const container = document.getElementById('detail-container');
  container.textContent = '';

  const top = document.createElement('div');
  top.className = 'detail-top';
  const catBadge = document.createElement('span');
  catBadge.className = 'cat-badge';
  catBadge.textContent = d.category;
  top.appendChild(catBadge);

  const title = document.createElement('div');
  title.className = 'detail-title';
  title.textContent = d.title;

  const date = new Date(d.created_at).toLocaleDateString('ko-KR', { year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' });
  const meta = document.createElement('div');
  meta.className = 'detail-meta';
  const dateSpan = document.createElement('span');
  dateSpan.textContent = date + (d.updated_at ? ' (수정됨)' : '');
  const viewSpan = document.createElement('span');
  viewSpan.textContent = '조회 ' + d.view_count;
  meta.appendChild(dateSpan);
  meta.appendChild(viewSpan);

  const content = document.createElement('div');
  content.className = 'detail-content';
  content.textContent = d.content;

  container.appendChild(top);
  container.appendChild(title);
  container.appendChild(meta);
  container.appendChild(content);
}

function setLoading(container, msg) {
  container.textContent = '';
  const el = document.createElement('div');
  el.className = 'loading';
  el.textContent = msg;
  container.appendChild(el);
}

loadList();
</script>
</body>
</html>
