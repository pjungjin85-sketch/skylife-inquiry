<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>kt skylife 관리자</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" integrity="sha384-0w2KAL2YHP6wKOkUDzkCDGgVvfmHnj02DHeQ6XcHOgTfFsGyonKOpShMH1x6nk9o" crossorigin="anonymous"></script>
<style>
:root {
  --red: #E60012; --red2: #CC0010; --red-light: #FFF5F5; --red-border: #FFCCCC;
  --black: #1A1A1A; --dark: #333333; --mid: #666666; --light: #999999;
  --bg: #FFFFFF; --bg2: #F7F7F7; --bg3: #FAFAFA; --border: #E8E8E8;
  --shadow: 0 2px 12px rgba(0,0,0,0.08); --shadow-hover: 0 8px 28px rgba(0,0,0,0.14);
  --green: #16a34a; --green-light: #f0fdf4; --green-border: #bbf7d0;
  --yellow: #d97706; --yellow-light: #fffbeb; --yellow-border: #fde68a;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Noto Sans KR', sans-serif; background: var(--bg2); color: var(--black); min-height: 100vh; }

/* 잠금 화면 */
#lock-overlay { position: fixed; inset: 0; background: var(--bg2); z-index: 9999; display: flex; align-items: center; justify-content: center; padding: 20px; }
#lock-overlay.hidden { display: none; }
.lock-box { background: var(--bg); border: 1px solid var(--border); border-top: 4px solid var(--red); border-radius: 16px; padding: 40px 32px; width: 100%; max-width: 360px; box-shadow: var(--shadow); }
.lock-logo { font-size: 18px; font-weight: 900; color: var(--black); margin-bottom: 4px; }
.lock-logo span { color: var(--red); }
.lock-title { font-size: 14px; color: var(--mid); margin-bottom: 28px; }
.lock-label { font-size: 12px; font-weight: 700; color: var(--dark); margin-bottom: 6px; }
.lock-input-wrap { position: relative; margin-bottom: 10px; }
.lock-input-wrap input { width: 100%; padding: 12px 44px 12px 14px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; font-family: inherit; outline: none; }
.lock-input-wrap input:focus { border-color: var(--red); }
.lock-toggle { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; font-size: 16px; }
.lock-error { font-size: 12px; color: var(--red); min-height: 18px; margin-bottom: 16px; }
.lock-btn { width: 100%; padding: 13px; background: var(--red); color: #fff; border: none; border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit; }
.lock-btn:hover { background: var(--red2); }
.lock-btn:disabled { background: var(--light); cursor: not-allowed; }

/* 헤더 */
header { background: var(--bg); border-top: 3px solid var(--red); border-bottom: 1px solid var(--border); padding: 0 20px; position: sticky; top: 0; z-index: 200; box-shadow: var(--shadow); }
.header-inner { max-width: 860px; margin: 0 auto; display: flex; align-items: center; height: 56px; gap: 12px; }
.logo-text { font-size: 18px; font-weight: 900; color: var(--black); }
.logo-text span { color: var(--red); }
.header-badge { background: var(--red); color: #fff; font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 3px; }
.header-title { font-size: 15px; font-weight: 700; color: var(--dark); }
.logout-btn { margin-left: auto; padding: 6px 14px; border: 1px solid var(--border); border-radius: 6px; font-size: 12px; color: var(--mid); background: var(--bg); cursor: pointer; font-family: inherit; }
.logout-btn:hover { border-color: var(--red); color: var(--red); }

/* 본문 */
.content { max-width: 860px; margin: 0 auto; padding: 24px 20px; }

/* 메인 탭 (공지사항 관리 / 회원 승인) */
.main-tab-bar { display: flex; gap: 8px; margin-bottom: 20px; border-bottom: 1px solid var(--border); }
.main-tab-btn { padding: 10px 4px; margin-right: 20px; font-size: 14px; font-weight: 700; color: var(--mid); border: none; background: none; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; font-family: inherit; }
.main-tab-btn.active { color: var(--red); border-bottom-color: var(--red); }
.main-tab-content { display: none; }
.main-tab-content.active { display: block; }

/* 공지 작성 폼 */
.form-card { background: var(--bg); border: 1px solid var(--border); border-radius: 16px; padding: 24px; box-shadow: var(--shadow); margin-bottom: 24px; }
.form-card h2 { font-size: 16px; font-weight: 900; margin-bottom: 18px; }
.form-row { display: grid; grid-template-columns: 2fr 1fr; gap: 14px; margin-bottom: 14px; }
.form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.form-group label { font-size: 12px; font-weight: 700; color: var(--dark); }
input, select, textarea { width: 100%; padding: 11px 14px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; font-family: inherit; color: var(--black); background: var(--bg); outline: none; }
input:focus, select:focus, textarea:focus { border-color: var(--red); }
textarea { resize: vertical; min-height: 140px; line-height: 1.6; }
.form-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 4px; }
.btn-primary { padding: 11px 22px; background: var(--red); color: #fff; border: none; border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit; }
.btn-primary:hover { background: var(--red2); }
.btn-primary:disabled { background: var(--light); cursor: not-allowed; }
.btn-ghost { padding: 11px 18px; background: var(--bg); color: var(--mid); border: 1px solid var(--border); border-radius: 8px; font-size: 14px; cursor: pointer; font-family: inherit; }
.btn-ghost:hover { border-color: var(--red); color: var(--red); }
.form-feedback { font-size: 12px; margin-top: 8px; min-height: 16px; }
.form-feedback.ok { color: var(--green); }
.form-feedback.fail { color: var(--red); }
.checkbox-label { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--dark); cursor: pointer; }
.checkbox-label input[type="checkbox"] { width: auto; accent-color: var(--red); cursor: pointer; }
.pin-badge { font-size: 11px; font-weight: 700; color: var(--red); }

/* 목록 헤더 */
.list-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.list-count { font-size: 12px; color: var(--light); }
.refresh-btn { padding: 6px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 12px; color: var(--mid); background: var(--bg); cursor: pointer; font-family: inherit; }
.refresh-btn:hover { border-color: var(--red); color: var(--red); }

/* 검색 (공지 검색 / 회원 검색 공용) */
.search-bar { margin-bottom: 12px; }
.search-bar input { max-width: 320px; }

/* 필터 탭 */
.filter-bar { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
.filter-btn { padding: 7px 16px; border: 1px solid var(--border); border-radius: 20px; font-size: 13px; font-weight: 500; color: var(--mid); background: var(--bg); cursor: pointer; font-family: inherit; transition: all .2s; }
.filter-btn.active { background: var(--red); color: #fff; border-color: var(--red); }

/* 공지 카드 */
.notice-card { background: var(--bg); border: 1px solid var(--border); border-radius: 14px; margin-bottom: 12px; overflow: hidden; box-shadow: var(--shadow); }
.notice-card.pinned .card-head { background: var(--red-light); }
.card-head { padding: 16px 18px; cursor: pointer; display: flex; align-items: flex-start; gap: 12px; }
.card-head-info { flex: 1; min-width: 0; }
.card-top { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }
.cat-badge { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 3px; background: var(--red-light); color: var(--red); border: 1px solid var(--red-border); }
.view-badge { font-size: 11px; color: var(--light); }
.card-title { font-size: 14px; font-weight: 700; color: var(--black); }
.card-meta { font-size: 11px; color: var(--light); margin-top: 4px; }
.card-chevron { font-size: 12px; color: var(--light); flex-shrink: 0; transition: transform .2s; padding-top: 2px; }
.card-open .card-chevron { transform: rotate(180deg); }

.card-body { display: none; border-top: 1px solid var(--border); padding: 18px; }
.card-open .card-body { display: block; }
.body-text { font-size: 13px; color: var(--dark); line-height: 1.7; white-space: pre-wrap; margin-bottom: 16px; }
.card-actions { display: flex; gap: 8px; justify-content: flex-end; }
.action-btn { padding: 8px 16px; border-radius: 8px; font-size: 12px; cursor: pointer; font-family: inherit; border: 1px solid var(--border); background: var(--bg); color: var(--mid); }
.action-btn:hover { border-color: var(--red); color: var(--red); }

.loading { text-align: center; padding: 48px 20px; color: var(--light); font-size: 14px; }
.empty { text-align: center; padding: 48px 20px; }
.empty-icon { font-size: 40px; margin-bottom: 12px; }
.empty-text { font-size: 14px; color: var(--light); }

/* 계정 카드 */
.account-card { background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; margin-bottom: 10px; box-shadow: var(--shadow); display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.account-info { flex: 1; min-width: 200px; }
.account-name-row { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; flex-wrap: wrap; }
.account-name { font-size: 14px; font-weight: 700; color: var(--black); }
.account-code { font-size: 12px; font-weight: 800; color: var(--red); background: var(--red-light); border: 1px solid var(--red-border); padding: 2px 8px; border-radius: 4px; letter-spacing: .02em; }
.account-meta { font-size: 12px; color: var(--mid); }
.account-date { font-size: 11px; color: var(--light); margin-top: 2px; }
.account-actions { display: flex; gap: 6px; flex-shrink: 0; }
.account-btn { padding: 8px 14px; border-radius: 6px; font-size: 12px; font-weight: 700; cursor: pointer; border: 1px solid var(--border); background: var(--bg); font-family: inherit; }
.account-btn.approve { background: var(--green-light); color: var(--green); border-color: var(--green-border); }
.account-btn.approve:hover { background: var(--green); color: #fff; }
.account-btn.reject { background: var(--red-light); color: var(--red); border-color: var(--red-border); }
.account-btn.reject:hover { background: var(--red); color: #fff; }
.account-btn:disabled { opacity: .45; cursor: not-allowed; }
.status-badge { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 3px; }
.status-badge.pending { background: var(--yellow-light); color: var(--yellow); border: 1px solid var(--yellow-border); }
.status-badge.answered { background: var(--green-light); color: var(--green); border: 1px solid var(--green-border); }
.status-badge.rejected { background: var(--red-light); color: var(--red); border: 1px solid var(--red-border); }

footer { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-top: 1px solid var(--border); text-align: center; padding: 10px; font-size: 11px; color: #666666; z-index: 50; }

@media (max-width: 480px) {
  .content { padding: 16px 14px; }
  .form-row { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<!-- 잠금 화면 -->
<div id="lock-overlay">
  <div class="lock-box">
    <div class="lock-logo">kt <span>skylife</span></div>
    <div class="lock-title">관리자 로그인</div>
    <div class="lock-label">관리자 아이디</div>
    <div class="lock-input-wrap">
      <input type="text" id="admin-username" placeholder="아이디" autocomplete="username" onkeydown="if(event.key==='Enter')document.getElementById('admin-password').focus()">
    </div>
    <div class="lock-label">비밀번호</div>
    <div class="lock-input-wrap">
      <input type="password" id="admin-password" placeholder="비밀번호 입력" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()">
      <button class="lock-toggle" id="pw-toggle" onclick="togglePw()">👁</button>
    </div>
    <div class="lock-error" id="pw-error"></div>
    <button class="lock-btn" id="login-btn" onclick="login()">로그인</button>
  </div>
</div>

<header>
  <div class="header-inner">
    <span class="logo-text">kt <span>skylife</span></span>
    <span class="header-badge">관리자</span>
    <span class="header-title">관리자 페이지</span>
    <button class="logout-btn" onclick="logout()">로그아웃</button>
  </div>
</header>

<div class="content">
  <div class="main-tab-bar">
    <button class="main-tab-btn active" data-tab="notices" onclick="switchMainTab('notices')">공지사항 관리</button>
    <button class="main-tab-btn" data-tab="accounts" onclick="switchMainTab('accounts')">회원 승인</button>
  </div>

  <div id="tab-notices" class="main-tab-content active">
    <div class="form-card">
      <h2 id="form-title">공지 작성</h2>
      <div class="form-row">
        <div class="form-group">
          <label>제목</label>
          <input type="text" id="f-title" placeholder="공지 제목">
        </div>
        <div class="form-group">
          <label>분류</label>
          <select id="f-category">
            <option>긴급</option>
            <option>정책</option>
            <option>규제</option>
            <option>상품</option>
            <option selected>기타</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label>내용</label>
        <textarea id="f-content" placeholder="공지 내용을 입력해주세요."></textarea>
      </div>
      <div class="form-group form-group-checkbox">
        <label class="checkbox-label">
          <input type="checkbox" id="f-pinned">
          <span>상단 고정 (게시판 맨 위에 계속 고정 노출)</span>
        </label>
      </div>
      <div class="form-actions">
        <button class="btn-ghost" id="cancel-edit-btn" onclick="cancelEdit()" style="display:none">취소</button>
        <button class="btn-primary" id="submit-btn" onclick="submitNotice()">등록</button>
      </div>
      <div class="form-feedback" id="form-feedback"></div>
    </div>

    <div class="search-bar">
      <input type="text" id="notice-search" placeholder="제목 또는 내용 검색" oninput="setNoticeSearch(this.value)">
    </div>
    <div class="list-header">
      <span class="list-count" id="notice-count"></span>
      <button class="refresh-btn" onclick="loadNotices()">↺ 새로고침</button>
    </div>
    <div id="notice-list-container"></div>
  </div>

  <div id="tab-accounts" class="main-tab-content">
    <div class="search-bar">
      <input type="text" id="account-search" placeholder="계정(이메일) 또는 이름 검색" oninput="setAccountSearch(this.value)">
    </div>
    <div class="filter-bar">
      <button class="filter-btn active" data-afilter="all" onclick="setAccountFilter('all')">전체</button>
      <button class="filter-btn" data-afilter="pending" onclick="setAccountFilter('pending')">승인 대기</button>
      <button class="filter-btn" data-afilter="approved" onclick="setAccountFilter('approved')">승인됨</button>
      <button class="filter-btn" data-afilter="rejected" onclick="setAccountFilter('rejected')">정지됨</button>
    </div>
    <div id="accounts-list-container"></div>
  </div>
</div>

<footer>Created by 박정진 &nbsp;|&nbsp; 관리자</footer>

<script>
const SUPABASE_URL = 'https://qvzlwhwxspmofrwdvgdd.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF2emx3aHd4c3Btb2Zyd2R2Z2RkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQxNzcyNDQsImV4cCI6MjA5OTc1MzI0NH0.uMdamJNn-GHRGfcTNnij6gapaG49bnXjC2fk32RcTfg';
const AUTH_EMAIL_DOMAIN = '@skylife-agent.local';
const USERNAME_RE = /^[a-zA-Z0-9_-]{4,20}$/;

const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

let allNotices = [];
let noticeSearchQuery = '';
let editingId = null;
let allAccounts = [];
let accountsLoaded = false;
let accountFilter = 'all';
let accountSearchQuery = '';

/* ── 인증 ── */
function togglePw() {
  const inp = document.getElementById('admin-password');
  inp.type = inp.type === 'password' ? 'text' : 'password';
}

async function login() {
  const username = document.getElementById('admin-username').value.trim();
  const password = document.getElementById('admin-password').value;
  const errEl = document.getElementById('pw-error');
  errEl.textContent = '';

  if (!USERNAME_RE.test(username) || !password) { errEl.textContent = '아이디와 비밀번호를 입력해주세요'; return; }

  const btn = document.getElementById('login-btn');
  btn.disabled = true; btn.textContent = '로그인 중...';

  const { data, error } = await sb.auth.signInWithPassword({ email: username.toLowerCase() + AUTH_EMAIL_DOMAIN, password });

  if (error) {
    btn.disabled = false; btn.textContent = '로그인';
    errEl.textContent = '아이디 또는 비밀번호가 올바르지 않습니다';
    return;
  }

  const ok = await verifyAdmin(data.user.id);
  btn.disabled = false; btn.textContent = '로그인';

  if (!ok) {
    await sb.auth.signOut();
    errEl.textContent = '관리자 권한이 없는 계정입니다';
    return;
  }

  unlockAdmin();
}

async function verifyAdmin(userId) {
  const { data: profile } = await sb.from('profiles').select('is_admin').eq('id', userId).single();
  return !!(profile && profile.is_admin);
}

function unlockAdmin() {
  document.getElementById('lock-overlay').classList.add('hidden');
  loadNotices();
}

async function logout() {
  await sb.auth.signOut();
  location.reload();
}

async function checkSession() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return;
  const ok = await verifyAdmin(session.user.id);
  if (ok) unlockAdmin();
  else await sb.auth.signOut();
}

/* ── 메인 탭 전환 ── */
function switchMainTab(tab) {
  document.querySelectorAll('.main-tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.getElementById('tab-notices').classList.toggle('active', tab === 'notices');
  document.getElementById('tab-accounts').classList.toggle('active', tab === 'accounts');
  if (tab === 'accounts' && !accountsLoaded) loadAccounts();
}

/* ── 공지 작성/수정 ── */
async function submitNotice() {
  const title = document.getElementById('f-title').value.trim();
  const category = document.getElementById('f-category').value;
  const content = document.getElementById('f-content').value.trim();
  const pinned = document.getElementById('f-pinned').checked;

  if (!title || !content) { showFormFeedback('fail', '제목과 내용은 필수 입력 항목입니다.'); return; }

  const btn = document.getElementById('submit-btn');
  btn.disabled = true; btn.textContent = editingId ? '수정 중...' : '등록 중...';

  let error;
  if (editingId) {
    ({ error } = await sb.from('notices').update({ title, category, content, pinned, updated_at: new Date().toISOString() }).eq('id', editingId));
  } else {
    ({ error } = await sb.from('notices').insert({ title, category, content, pinned }));
  }

  btn.disabled = false;

  if (error) { showFormFeedback('fail', '저장 실패. 다시 시도해주세요.'); btn.textContent = editingId ? '수정 저장' : '등록'; return; }

  showFormFeedback('ok', '✅ 저장되었습니다.');
  cancelEdit();
  await loadNotices();
}

function startEdit(d) {
  editingId = d.id;
  document.getElementById('form-title').textContent = '공지 수정';
  document.getElementById('f-title').value = d.title;
  document.getElementById('f-category').value = d.category;
  document.getElementById('f-content').value = d.content;
  document.getElementById('f-pinned').checked = !!d.pinned;
  document.getElementById('submit-btn').textContent = '수정 저장';
  document.getElementById('cancel-edit-btn').style.display = 'inline-block';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function cancelEdit() {
  editingId = null;
  document.getElementById('form-title').textContent = '공지 작성';
  document.getElementById('f-title').value = '';
  document.getElementById('f-category').value = '기타';
  document.getElementById('f-content').value = '';
  document.getElementById('f-pinned').checked = false;
  document.getElementById('submit-btn').textContent = '등록';
  document.getElementById('cancel-edit-btn').style.display = 'none';
}

async function deleteNotice(id) {
  if (!confirm('이 공지를 삭제하시겠습니까?')) return;
  const { error } = await sb.from('notices').delete().eq('id', id);
  if (error) { alert('삭제 실패'); return; }
  await loadNotices();
}

function showFormFeedback(type, msg) {
  const el = document.getElementById('form-feedback');
  el.className = 'form-feedback ' + type;
  el.textContent = msg;
  setTimeout(() => { el.textContent = ''; }, 4000);
}

async function loadNotices() {
  setNoticeLoading('불러오는 중...');
  const { data, error } = await sb.from('notices').select('*')
    .order('pinned', { ascending: false })
    .order('created_at', { ascending: false });
  if (error) { setNoticeLoading('불러오기 실패. 새로고침해주세요.'); return; }
  allNotices = data;
  document.getElementById('notice-count').textContent = '전체 ' + data.length + '건';
  renderNoticeList();
}

function setNoticeSearch(q) {
  noticeSearchQuery = q.trim().toLowerCase();
  renderNoticeList();
}

function renderNoticeList() {
  const container = document.getElementById('notice-list-container');
  container.textContent = '';

  const filtered = noticeSearchQuery
    ? allNotices.filter(d =>
        (d.title || '').toLowerCase().includes(noticeSearchQuery) ||
        (d.content || '').toLowerCase().includes(noticeSearchQuery))
    : allNotices;

  if (!filtered.length) {
    const empty = document.createElement('div');
    empty.className = 'empty';
    const icon = document.createElement('div'); icon.className = 'empty-icon'; icon.textContent = allNotices.length ? '🔍' : '📭';
    const text = document.createElement('div'); text.className = 'empty-text'; text.textContent = allNotices.length ? '검색 결과가 없습니다.' : '등록된 공지가 없습니다.';
    empty.appendChild(icon); empty.appendChild(text);
    container.appendChild(empty);
    return;
  }
  filtered.forEach(d => container.appendChild(buildNoticeCard(d)));
}

function buildNoticeCard(d) {
  const card = document.createElement('div');
  card.className = 'notice-card' + (d.pinned ? ' pinned' : '');
  card.id = 'notice-' + d.id;

  const date = new Date(d.created_at).toLocaleDateString('ko-KR', { year:'2-digit', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' });

  const head = document.createElement('div');
  head.className = 'card-head';
  head.onclick = () => card.classList.toggle('card-open');

  const info = document.createElement('div');
  info.className = 'card-head-info';

  const top = document.createElement('div');
  top.className = 'card-top';
  const catBadge = document.createElement('span');
  catBadge.className = 'cat-badge';
  catBadge.textContent = d.category;
  const viewBadge = document.createElement('span');
  viewBadge.className = 'view-badge';
  viewBadge.textContent = '조회 ' + d.view_count;
  top.appendChild(catBadge); top.appendChild(viewBadge);
  if (d.pinned) {
    const pinBadge = document.createElement('span');
    pinBadge.className = 'pin-badge';
    pinBadge.textContent = '📌 고정';
    top.appendChild(pinBadge);
  }

  const title = document.createElement('div');
  title.className = 'card-title';
  title.textContent = d.title;

  const meta = document.createElement('div');
  meta.className = 'card-meta';
  meta.textContent = date + (d.updated_at ? ' (수정됨)' : '');

  info.appendChild(top); info.appendChild(title); info.appendChild(meta);

  const chevron = document.createElement('span');
  chevron.className = 'card-chevron';
  chevron.textContent = '▼';

  head.appendChild(info); head.appendChild(chevron);

  const body = document.createElement('div');
  body.className = 'card-body';

  const text = document.createElement('div');
  text.className = 'body-text';
  text.textContent = d.content;
  body.appendChild(text);

  const actions = document.createElement('div');
  actions.className = 'card-actions';
  const editBtn = document.createElement('button');
  editBtn.className = 'action-btn';
  editBtn.textContent = '수정';
  editBtn.onclick = (e) => { e.stopPropagation(); startEdit(d); };
  const delBtn = document.createElement('button');
  delBtn.className = 'action-btn';
  delBtn.textContent = '삭제';
  delBtn.onclick = (e) => { e.stopPropagation(); deleteNotice(d.id); };
  actions.appendChild(editBtn); actions.appendChild(delBtn);
  body.appendChild(actions);

  card.appendChild(head);
  card.appendChild(body);
  return card;
}

function setNoticeLoading(msg) {
  const el = document.createElement('div'); el.className = 'loading'; el.textContent = msg;
  const c = document.getElementById('notice-list-container'); c.textContent = ''; c.appendChild(el);
}

/* ── 회원 승인 ── */
async function loadAccounts() {
  const { data, error } = await sb.rpc('admin_list_accounts');
  if (error) { alert('회원 목록을 불러오지 못했습니다.\n' + (error.message || JSON.stringify(error))); return; }
  allAccounts = data || [];
  accountsLoaded = true;
  renderAccounts();
}

function setAccountFilter(f) {
  accountFilter = f;
  document.querySelectorAll('[data-afilter]').forEach(b => b.classList.toggle('active', b.dataset.afilter === f));
  renderAccounts();
}

function setAccountSearch(q) {
  accountSearchQuery = q.trim().toLowerCase();
  renderAccounts();
}

function renderAccounts() {
  let filtered = accountFilter === 'all' ? allAccounts : allAccounts.filter(a => a.status === accountFilter);
  if (accountSearchQuery) {
    filtered = filtered.filter(a =>
      (a.name || '').toLowerCase().includes(accountSearchQuery) ||
      (a.email || '').toLowerCase().includes(accountSearchQuery)
    );
  }
  const container = document.getElementById('accounts-list-container');
  container.textContent = '';

  if (!filtered.length) {
    const empty = document.createElement('div');
    empty.className = 'empty';
    const icon = document.createElement('div'); icon.className = 'empty-icon'; icon.textContent = '👤';
    const text = document.createElement('div'); text.className = 'empty-text'; text.textContent = '해당하는 계정이 없습니다.';
    empty.appendChild(icon); empty.appendChild(text);
    container.appendChild(empty);
    return;
  }
  filtered.forEach(a => container.appendChild(buildAccountCard(a)));
}

function buildAccountCard(a) {
  const card = document.createElement('div');
  card.className = 'account-card';

  const info = document.createElement('div');
  info.className = 'account-info';
  const nameRow = document.createElement('div');
  nameRow.className = 'account-name-row';
  const name = document.createElement('span'); name.className = 'account-name'; name.textContent = a.name;
  const code = document.createElement('span'); code.className = 'account-code'; code.textContent = a.agency_code;
  const statusBadge = document.createElement('span');
  statusBadge.className = 'status-badge ' + (a.status === 'approved' ? 'answered' : a.status === 'rejected' ? 'rejected' : 'pending');
  statusBadge.textContent = a.status === 'approved' ? '승인됨' : a.status === 'rejected' ? '정지됨' : '승인대기';
  nameRow.appendChild(name); nameRow.appendChild(code); nameRow.appendChild(statusBadge);

  const meta = document.createElement('div');
  meta.className = 'account-meta';
  meta.textContent = a.agency_name;

  const date = document.createElement('div');
  date.className = 'account-date';
  date.textContent = new Date(a.created_at).toLocaleDateString('ko-KR', { year:'2-digit', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' }) + ' 가입';

  info.appendChild(nameRow); info.appendChild(meta); info.appendChild(date);

  const actions = document.createElement('div');
  actions.className = 'account-actions';
  const approveBtn = document.createElement('button');
  approveBtn.className = 'account-btn approve';
  approveBtn.textContent = '승인';
  approveBtn.disabled = a.status === 'approved';
  approveBtn.onclick = () => setAccountStatus(a.id, 'approved');
  const rejectBtn = document.createElement('button');
  rejectBtn.className = 'account-btn reject';
  rejectBtn.textContent = '정지';
  rejectBtn.disabled = a.status === 'rejected';
  rejectBtn.onclick = () => setAccountStatus(a.id, 'rejected');
  actions.appendChild(approveBtn); actions.appendChild(rejectBtn);

  card.appendChild(info); card.appendChild(actions);
  return card;
}

async function setAccountStatus(id, status) {
  const { error } = await sb.rpc('admin_set_status', { account_id: id, new_status: status });
  if (error) { alert('처리 실패. 다시 시도해주세요.\n' + (error.message || JSON.stringify(error))); return; }
  const { data } = await sb.rpc('admin_list_accounts');
  allAccounts = data || allAccounts;
  renderAccounts();
}

/* ── 초기화 ── */
window.addEventListener('DOMContentLoaded', () => {
  document.getElementById('admin-username').focus();
  checkSession();
});
</script>
